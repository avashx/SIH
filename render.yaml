# Render blueprint — the shortest path to a live URL.
# In the Render dashboard: New → Blueprint → point it at this repository.
# Render builds the Dockerfile, injects $PORT, and redeploys on every push to main.
services:
  - type: web
    name: sikkim-landslide
    runtime: docker
    plan: free            # 512 MB RAM; the app idles at ~90 MB
    region: singapore     # closest Render region to India
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Trimmed from the Dockerfile default so the GDAL block cache cannot push
      # a 512 MB free instance into an OOM restart under tile load.
      - key: GDAL_CACHEMAX
        value: "128"
